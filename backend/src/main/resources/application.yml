# EstateVista V2 backend — shared configuration.
# Environment-specific overrides live in application-dev.yml / application-prod.yml.
# No credentials are stored in this file.

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: EV_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /

spring:
  application:
    name: estatevista-api
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB
      resolve-lazily: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/estatevista}
    username: ${DB_USERNAME:estatevista}
    password: ${DB_PASSWORD:kai_vista}
    hikari:
      pool-name: EstateVistaPool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  session:
    timeout: 30m
    jdbc:
      # Schema is owned by Flyway (see db/migration), never by Spring Session.
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  websocket:
    endpoint: /ws
    allowed-origins: ${APP_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    login:
      max-attempts: ${APP_RATE_LIMIT_LOGIN_MAX_ATTEMPTS:10}
      window-seconds: ${APP_RATE_LIMIT_LOGIN_WINDOW_SECONDS:900}
    registration:
      max-attempts: ${APP_RATE_LIMIT_REGISTRATION_MAX_ATTEMPTS:5}
      window-seconds: ${APP_RATE_LIMIT_REGISTRATION_WINDOW_SECONDS:60}
    image-upload:
      max-attempts: ${APP_RATE_LIMIT_IMAGE_UPLOAD_MAX_ATTEMPTS:20}
      window-seconds: ${APP_RATE_LIMIT_IMAGE_UPLOAD_WINDOW_SECONDS:3600}
    public-search:
      max-attempts: ${APP_RATE_LIMIT_PUBLIC_SEARCH_MAX_ATTEMPTS:120}
      window-seconds: ${APP_RATE_LIMIT_PUBLIC_SEARCH_WINDOW_SECONDS:60}
    property-detail:
      max-attempts: ${APP_RATE_LIMIT_PROPERTY_DETAIL_MAX_ATTEMPTS:300}
      window-seconds: ${APP_RATE_LIMIT_PROPERTY_DETAIL_WINDOW_SECONDS:60}
    authenticated-api:
      max-attempts: ${APP_RATE_LIMIT_AUTHENTICATED_API_MAX_ATTEMPTS:300}
      window-seconds: ${APP_RATE_LIMIT_AUTHENTICATED_API_WINDOW_SECONDS:60}
    admin-mutation:
      max-attempts: ${APP_RATE_LIMIT_ADMIN_MUTATION_MAX_ATTEMPTS:60}
      window-seconds: ${APP_RATE_LIMIT_ADMIN_MUTATION_WINDOW_SECONDS:60}
    favorite-mutation:
      max-attempts: ${APP_RATE_LIMIT_FAVORITE_MUTATION_MAX_ATTEMPTS:60}
      window-seconds: ${APP_RATE_LIMIT_FAVORITE_MUTATION_WINDOW_SECONDS:60}
    inquiry-submission-burst:
      max-attempts: ${APP_RATE_LIMIT_INQUIRY_SUBMISSION_BURST_MAX_ATTEMPTS:5}
      window-seconds: ${APP_RATE_LIMIT_INQUIRY_SUBMISSION_BURST_WINDOW_SECONDS:60}
    inquiry-submission-sustained:
      max-attempts: ${APP_RATE_LIMIT_INQUIRY_SUBMISSION_SUSTAINED_MAX_ATTEMPTS:30}
      window-seconds: ${APP_RATE_LIMIT_INQUIRY_SUBMISSION_SUSTAINED_WINDOW_SECONDS:3600}
  image-cleanup:
    enabled: ${APP_IMAGE_CLEANUP_ENABLED:true}
    poll-ms: ${APP_IMAGE_CLEANUP_POLL_MS:5000}
    batch-size: ${APP_IMAGE_CLEANUP_BATCH_SIZE:20}
    max-attempts: ${APP_IMAGE_CLEANUP_MAX_ATTEMPTS:5}
    backoff-ms: ${APP_IMAGE_CLEANUP_BACKOFF_MS:1000}
    max-backoff-ms: ${APP_IMAGE_CLEANUP_MAX_BACKOFF_MS:60000}
    lease-seconds: ${APP_IMAGE_CLEANUP_LEASE_SECONDS:60}
  storage:
    cloudinary:
      # Production adapter is opt-in. Secrets have no usable defaults.
      enabled: ${CLOUDINARY_ENABLED:false}
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      folder: ${CLOUDINARY_FOLDER:estatevista/properties}
      timeout-seconds: ${CLOUDINARY_TIMEOUT_SECONDS:10}

logging:
  level:
    root: INFO
    com.estatevista: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
