# Production profile.
# Deployment values are supplied by Render environment variables; nothing here
# contains a real credential or a production hostname.
# Activate with SPRING_PROFILES_ACTIVE=prod.

server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true

spring:
  datasource:
    # No defaults: startup must fail if production database configuration is absent.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

app:
  # No localhost fallback in production. Exact deployment origins must be
  # supplied, otherwise startup fails rather than silently allowing dev origins.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  websocket:
    allowed-origins: ${APP_WEBSOCKET_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    com.estatevista: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
    # SD-47: SQL, bind-parameter, and result-extraction logging stay off in
    # production even if a parent logger is raised later.
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.jdbc.extract: WARN
