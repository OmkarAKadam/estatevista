# Automated test profile.
# Activate with SPRING_PROFILES_ACTIVE=test.
#
# Web-layer tests start no Spring context and need no database. The opt-in
# persistence tests (com.estatevista.persistence) run only when TEST_DB_URL is
# set and must never target development or production data.
#
# Note: password deliberately has no usable default. A real test database must
# supply TEST_DB_PASSWORD explicitly.

spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/estatevista_test}
    username: ${TEST_DB_USERNAME:estatevista}
    password: ${TEST_DB_PASSWORD:}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true

app:
  rate-limit:
    login:
      max-attempts: 1000
      window-seconds: 900
    registration:
      max-attempts: 1000
      window-seconds: 60

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.estatevista: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.flywaydb: INFO
