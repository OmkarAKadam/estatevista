name: Backend verification

on:
  push:
    branches:
      - main
      - stage-2-backend-foundation
    paths:
      - 'backend/**'
      - '.github/workflows/backend-verify.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: estatevista_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d estatevista_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run full Maven verification
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/estatevista_test
          TEST_DB_USERNAME: postgres
          TEST_DB_PASSWORD: postgres
        run: mvn -B clean verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-${{ github.run_id }}
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
